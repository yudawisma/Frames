<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YDX - Sector | Waterfall Serenity</title>
    <meta
      name="description"
      content="Galeri foto air terjun: catatan dari air terjun yang pernah saya datangi."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/frames.css" />
    <link rel="stylesheet" href="css/reel.css" />

    <script>
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches)
        document.documentElement.classList.add("js");
    </script>
  </head>
  <body class="frames-page">
    <div class="fr-progress" aria-hidden="true"></div>
    <div class="fr-cursor" aria-hidden="true">Lihat</div>

    <header class="fr-hero">
      <!-- poster harus gambar, bukan mp4 -->
      <video
        class="fr-hero__bg"
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
        poster="img/12.PNG"
      >
        <source src="video/vd-small.mp4" type="video/mp4" />
      </video>

      <nav class="fr-nav" aria-label="Navigasi">
        <a
          href="https://portofo-silk.vercel.app"
          data-portfolio=""
          class="fr-nav__brand"
          >Kembali ke portfolio</a
        >
        <div class="fr-nav__links">
          <a href="https://portofo-silk.vercel.app" data-portfolio="">Home</a>
          <a href="#gallery">Gallery</a>
          <a
            href="https://portofo-silk.vercel.app/#contact"
            data-portfolio="/#contact"
            >Contact</a
          >
        </div>
      </nav>

      <div class="fr-hero__body">
        <h1 class="fr-hero__title" data-split>YDX - Sector</h1>
        <p class="fr-hero__sub">WATERFALL SERENITY</p>
        <span class="fr-hero__rule"></span>
      </div>

      <div class="fr-hero__foot">
        <p>
          Catatan dari air terjun yang pernah saya datangi, satu foto satu
          cerita.
        </p>
        <span class="fr-hero__count" id="frCount"></span>
      </div>
    </header>

    <main id="gallery" class="fr-gallery">
      <noscript
        ><p style="padding: 64px 24px; text-align: center">
          Aktifkan JavaScript untuk melihat galeri foto.
        </p></noscript
      >
    </main>

    <footer class="fr-footer">
      <p>Air terjun berikutnya sedang menunggu.</p>
      <a href="https://portofo-silk.vercel.app" data-portfolio=""
        >Kembali ke portfolio</a
      >
    </footer>

    <div
      class="fr-lb"
      id="lightbox"
      role="dialog"
      aria-modal="true"
      aria-label="Pratinjau foto"
      hidden
    >
      <button
        type="button"
        class="fr-lb__btn fr-lb__close"
        data-lb="close"
        aria-label="Tutup"
      >
        Tutup
      </button>
      <button
        type="button"
        class="fr-lb__btn fr-lb__prev"
        data-lb="prev"
        aria-label="Foto sebelumnya"
      >
        Sebelumnya
      </button>
      <img alt="" />
      <button
        type="button"
        class="fr-lb__btn fr-lb__next"
        data-lb="next"
        aria-label="Foto berikutnya"
      >
        Berikutnya
      </button>
      <p class="fr-lb__cap"></p>
    </div>

    <!-- Video vertikal (ukuran HP). Disisipkan otomatis oleh js/reel.js setelah set foto pertama -->
    <template id="reelTpl">
      <section class="fr-reel" aria-label="Video air terjun">
        <div class="fr-reel__text">
          <h2>Foto bisa diam, airnya tidak.</h2>
          <p>
            Beberapa detik dari tempat yang sama. Nyalakan suaranya, karena
            bagian terbaiknya tidak bisa ditangkap kamera.
          </p>
        </div>
        <div class="fr-reel__phone">
          <video
            muted
            loop
            playsinline
            preload="metadata"
            src="video/reel.mp4"
            aria-label="Video vertikal air terjun"
          ></video>
          <button type="button" class="fr-reel__sound" aria-pressed="false">
            Nyalakan suara
          </button>
        </div>
      </section>
    </template>

    <script
      defer
      src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"
    ></script>
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
    ></script>
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"
    ></script>
    <script src="js/data.js"></script>
    <script src="js/frames.js" defer></script>
    <script src="js/reel.js" defer></script>
  </body>
</html>
